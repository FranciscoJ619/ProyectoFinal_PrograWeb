# /etc/nginx/sites-available/replayclub
# Sustituye TU-DOMINIO por el dominio real. Certbot agrega las líneas SSL automáticamente:
#   sudo certbot --nginx -d TU-DOMINIO -d www.TU-DOMINIO

server {
    listen 80;
    server_name TU-DOMINIO www.TU-DOMINIO;

    # Frontend: build estático de React (npm run build -> frontend/dist)
    root /var/www/replayclub;
    index index.html;

    client_max_body_size 6M;

    # API REST (Spring Boot en el puerto 8010, servido como JAR con systemd)
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: cualquier ruta del frontend devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
